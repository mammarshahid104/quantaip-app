apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()

    // Bundle the JS through Expo CLI instead of the RN CLI. This is what lets
    // `expo-updates` embed an update manifest in the binary, which is required
    // for OTA updates to work at all.
    //
    // Written by hand rather than by install-expo-modules, which emitted a form
    // that silently produces garbage on this project:
    //   * it used Groovy's `.execute()`, whose stdout is empty when the node
    //     process fails, so a failure became `new File("")` -> the android/app
    //     directory, and Gradle only complained much later with a confusing
    //     "expected a file but it was a directory".
    //   * it resolved '@expo/cli' from the project root, but npm does not hoist
    //     it — it lives at node_modules/expo/node_modules/@expo/cli — so the
    //     resolve threw MODULE_NOT_FOUND.
    // providers.exec fails loudly on a non-zero exit, and resolving relative to
    // expo's own package.json finds the CLI wherever npm chose to put it.
    entryFile = file(providers.exec {
        workingDir(rootDir)
        commandLine("node", "-e", "require('expo/scripts/resolveAppEntry')",
            rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute")
    }.standardOutput.asText.get().trim())

    cliFile = new File(providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print",
            "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim())

    bundleCommand = "export:embed"
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.quantaipapp"
    defaultConfig {
        applicationId "com.quantaipapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(QUANTAIP_UPLOAD_STORE_FILE)
            storePassword QUANTAIP_UPLOAD_STORE_PASSWORD
            keyAlias QUANTAIP_UPLOAD_KEY_ALIAS
            keyPassword QUANTAIP_UPLOAD_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-analytics")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}